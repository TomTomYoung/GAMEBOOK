name: Gamebook checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        suite: [short, medium, new-short]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check generated story and asset data
        run: node scripts/build-data.cjs --check
      - name: Verify all state graphs and saves
        run: npm test
      - name: Install browser test dependency
        run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify the listening notebook in ${{ matrix.browser }}
        env:
          BROWSER: ${{ matrix.browser }}
          QA_OUTPUT_DIR: test-results/${{ matrix.browser }}-${{ matrix.suite }}/audio-review
        run: node tests/audio-review.browser.cjs
      - name: Verify the direct-file game in ${{ matrix.browser }}
        env:
          BROWSER: ${{ matrix.browser }}
          BROWSER_SUITE: ${{ matrix.suite }}
          QA_OUTPUT_DIR: test-results/${{ matrix.browser }}-${{ matrix.suite }}
        run: npm run test:browser
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.browser }}-${{ matrix.suite }}
          path: test-results/${{ matrix.browser }}-${{ matrix.suite }}/
          if-no-files-found: warn
